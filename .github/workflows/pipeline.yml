name: Platform CI/CD

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: platform-cicd-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAMESPACE: ${{ github.repository_owner }}

jobs:
  ci:
    name: CI - Build Backend and Frontend
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      - name: Build backend
        run: dotnet build platform/backend/src/WebAPI/WebAPI.csproj --configuration Release

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check text encoding and mojibake
        run: npm run check:encoding

      - name: Build frontend
        env:
          PRERENDER_SEO_API_URL: ${{ vars.PRERENDER_SEO_API_URL }}
        run: npm run build --workspace @platform/frontend

  docker:
    name: CD - Build and Push Images
    runs-on: ubuntu-latest
    needs: ci
    if: github.event_name == 'push'
    outputs:
      image_tag: ${{ steps.vars.outputs.image_tag }}
      image_namespace: ${{ steps.vars.outputs.image_namespace }}
      deploy_env: ${{ steps.vars.outputs.deploy_env }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set image tags and environment
        id: vars
        shell: bash
        run: |
          echo "image_tag=${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"
          echo "image_namespace=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"
          if [[ "${GITHUB_REF}" == "refs/heads/main" ]]; then
            echo "deploy_env=production" >> "$GITHUB_OUTPUT"
          else
            echo "deploy_env=staging" >> "$GITHUB_OUTPUT"
          fi

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build frontend static bundle for nginx image
        env:
          PRERENDER_SEO_API_URL: ${{ vars.PRERENDER_SEO_API_URL }}
        run: npm run build --workspace @platform/frontend

      - name: Build and push backend image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: platform/backend/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ steps.vars.outputs.image_namespace }}/platform-backend:${{ steps.vars.outputs.image_tag }}
            ${{ env.REGISTRY }}/${{ steps.vars.outputs.image_namespace }}/platform-backend:${{ steps.vars.outputs.deploy_env }}

      - name: Build and push frontend image (nginx)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: platform/infra/nginx/Dockerfile
          push: true
          no-cache: true
          tags: |
            ${{ env.REGISTRY }}/${{ steps.vars.outputs.image_namespace }}/platform-frontend:${{ steps.vars.outputs.image_tag }}
            ${{ env.REGISTRY }}/${{ steps.vars.outputs.image_namespace }}/platform-frontend:${{ steps.vars.outputs.deploy_env }}

      - name: Build and push postgres image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: platform/infra/postgres/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ steps.vars.outputs.image_namespace }}/platform-postgres:${{ steps.vars.outputs.image_tag }}
            ${{ env.REGISTRY }}/${{ steps.vars.outputs.image_namespace }}/platform-postgres:${{ steps.vars.outputs.deploy_env }}

  deploy-staging:
    name: Deploy Staging
    runs-on: ubuntu-latest
    needs: docker
    if: github.ref == 'refs/heads/develop'
    environment: staging
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Encode compose files
        id: compose
        run: |
          echo "base=$(base64 -w0 docker-compose.yml)" >> "$GITHUB_OUTPUT"
          echo "deploy=$(base64 -w0 docker-compose.deploy.yml)" >> "$GITHUB_OUTPUT"

      - name: Deploy via SSH (staging)
        uses: appleboy/ssh-action@v1.0.3
        env:
          COMPOSE_BASE: ${{ steps.compose.outputs.base }}
          COMPOSE_DEPLOY: ${{ steps.compose.outputs.deploy }}
        with:
          host: ${{ secrets.STAGING_SSH_HOST }}
          username: ${{ secrets.STAGING_SSH_USER }}
          key: ${{ secrets.STAGING_SSH_KEY }}
          envs: COMPOSE_BASE,COMPOSE_DEPLOY
          script: |
            set -euo pipefail
            DEPLOY_PATH="/opt/platform"
            cd "$DEPLOY_PATH"
            BASE_URL="https://grummm.ru"
            TMP_BASE="$(mktemp /tmp/platform-compose-base.XXXXXX.yml)"
            TMP_DEPLOY="$(mktemp /tmp/platform-compose-deploy.XXXXXX.yml)"
            TMP_DEPLOY_EFFECTIVE=""
            TMP_BACKEND_ENV=""
            cleanup() {
              rm -f "$TMP_BASE" "$TMP_DEPLOY"
              if [ -n "$TMP_DEPLOY_EFFECTIVE" ] && [ "$TMP_DEPLOY_EFFECTIVE" != "$TMP_DEPLOY" ]; then
                rm -f "$TMP_DEPLOY_EFFECTIVE"
              fi
              if [ -n "$TMP_BACKEND_ENV" ]; then
                rm -f "$TMP_BACKEND_ENV"
              fi
            }
            trap cleanup EXIT
            echo "$COMPOSE_BASE" | base64 -d > "$TMP_BASE"
            echo "$COMPOSE_DEPLOY" | base64 -d > "$TMP_DEPLOY"
            DOCKER_CMD="docker"
            if ! docker info >/dev/null 2>&1; then
              if sudo -n docker info >/dev/null 2>&1; then
                DOCKER_CMD="sudo -n docker"
              else
                echo "ERROR: docker is not accessible for the SSH user, and passwordless sudo is not configured."
                echo "Fix: add the SSH user to the docker group, or configure NOPASSWD sudo for docker."
                exit 1
              fi
            fi
            TMP_DEPLOY_EFFECTIVE="$TMP_DEPLOY"
            if [ "$DOCKER_CMD" = "docker" ] && [ ! -r "$DEPLOY_PATH/.env.backend.local" ]; then
              BACKEND_CONTAINER_ID="$($DOCKER_CMD ps -aq --filter 'name=^platform-backend$' | head -n1 || true)"
              if [ -z "$BACKEND_CONTAINER_ID" ]; then
                echo "ERROR: cannot read $DEPLOY_PATH/.env.backend.local and no existing platform-backend container found for env fallback."
                echo "Fix: grant the SSH user read access to .env.backend.local, or run one manual deploy after creating the file."
                exit 1
              fi
              TMP_BACKEND_ENV="$(mktemp /tmp/platform-backend-env.XXXXXX.env)"
              $DOCKER_CMD inspect -f '{{range .Config.Env}}{{println .}}{{end}}' "$BACKEND_CONTAINER_ID" > "$TMP_BACKEND_ENV"
              TMP_DEPLOY_EFFECTIVE="$(mktemp /tmp/platform-compose-deploy-effective.XXXXXX.yml)"
              sed "s#\\./\\.env\\.backend\\.local#$TMP_BACKEND_ENV#g" "$TMP_DEPLOY" > "$TMP_DEPLOY_EFFECTIVE"
            fi
            compose_cmd() {
              $DOCKER_CMD compose --project-directory "$DEPLOY_PATH" -f "$TMP_BASE" -f "$TMP_DEPLOY_EFFECTIVE" "$@"
            }
            echo "${{ github.token }}" | $DOCKER_CMD login ghcr.io -u "${{ github.actor }}" --password-stdin
            export BACKEND_IMAGE="ghcr.io/${{ needs.docker.outputs.image_namespace }}/platform-backend:${{ needs.docker.outputs.image_tag }}"
            export NGINX_IMAGE="ghcr.io/${{ needs.docker.outputs.image_namespace }}/platform-frontend:${{ needs.docker.outputs.image_tag }}"
            export POSTGRES_IMAGE="ghcr.io/${{ needs.docker.outputs.image_namespace }}/platform-postgres:${{ needs.docker.outputs.image_tag }}"
            compose_cmd pull
            compose_cmd up -d --force-recreate --remove-orphans
            NGINX_CONTAINER_ID="$(compose_cmd ps -q nginx)"
            if [ -z "$NGINX_CONTAINER_ID" ]; then
              echo "ERROR: nginx container id is empty after deploy."
              exit 1
            fi
            RUNNING_NGINX_IMAGE="$($DOCKER_CMD inspect -f '{{.Config.Image}}' "$NGINX_CONTAINER_ID")"
            if [ "$RUNNING_NGINX_IMAGE" != "$NGINX_IMAGE" ]; then
              echo "ERROR: nginx image mismatch. expected=$NGINX_IMAGE actual=$RUNNING_NGINX_IMAGE"
              exit 1
            fi
            EXPECTED_ASSET="$($DOCKER_CMD run --rm "$NGINX_IMAGE" sh -lc "grep -o '/assets/index-[^\" ]*\\.js' /usr/share/nginx/html/index.html | head -n1")"
            ACTIVE_ASSET="$(curl -ksS "$BASE_URL/" | grep -o '/assets/index-[^\" ]*\\.js' | head -n1 || true)"
            if [ -n "$EXPECTED_ASSET" ] && [ -n "$ACTIVE_ASSET" ] && [ "$EXPECTED_ASSET" != "$ACTIVE_ASSET" ]; then
              echo "ERROR: live asset mismatch. expected=$EXPECTED_ASSET actual=$ACTIVE_ASSET base_url=$BASE_URL"
              exit 1
            fi
            $DOCKER_CMD system prune -af

  deploy-production:
    name: Deploy Production
    runs-on: ubuntu-latest
    needs: docker
    if: github.ref == 'refs/heads/main'
    environment: production
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Encode compose files
        id: compose
        run: |
          echo "base=$(base64 -w0 docker-compose.yml)" >> "$GITHUB_OUTPUT"
          echo "deploy=$(base64 -w0 docker-compose.deploy.yml)" >> "$GITHUB_OUTPUT"

      - name: Deploy via SSH (production)
        uses: appleboy/ssh-action@v1.0.3
        env:
          COMPOSE_BASE: ${{ steps.compose.outputs.base }}
          COMPOSE_DEPLOY: ${{ steps.compose.outputs.deploy }}
        with:
          host: ${{ secrets.PRODUCTION_SSH_HOST }}
          username: ${{ secrets.PRODUCTION_SSH_USER }}
          key: ${{ secrets.PRODUCTION_SSH_KEY }}
          envs: COMPOSE_BASE,COMPOSE_DEPLOY
          script: |
            set -euo pipefail
            DEPLOY_PATH="/opt/platform"
            cd "$DEPLOY_PATH"
            BASE_URL="https://grummm.ru"
            TMP_BASE="$(mktemp /tmp/platform-compose-base.XXXXXX.yml)"
            TMP_DEPLOY="$(mktemp /tmp/platform-compose-deploy.XXXXXX.yml)"
            TMP_DEPLOY_EFFECTIVE=""
            TMP_BACKEND_ENV=""
            cleanup() {
              rm -f "$TMP_BASE" "$TMP_DEPLOY"
              if [ -n "$TMP_DEPLOY_EFFECTIVE" ] && [ "$TMP_DEPLOY_EFFECTIVE" != "$TMP_DEPLOY" ]; then
                rm -f "$TMP_DEPLOY_EFFECTIVE"
              fi
              if [ -n "$TMP_BACKEND_ENV" ]; then
                rm -f "$TMP_BACKEND_ENV"
              fi
            }
            trap cleanup EXIT
            echo "$COMPOSE_BASE" | base64 -d > "$TMP_BASE"
            echo "$COMPOSE_DEPLOY" | base64 -d > "$TMP_DEPLOY"
            DOCKER_CMD="docker"
            if ! docker info >/dev/null 2>&1; then
              if sudo -n docker info >/dev/null 2>&1; then
                DOCKER_CMD="sudo -n docker"
              else
                echo "ERROR: docker is not accessible for the SSH user, and passwordless sudo is not configured."
                echo "Fix: add the SSH user to the docker group, or configure NOPASSWD sudo for docker."
                exit 1
              fi
            fi
            TMP_DEPLOY_EFFECTIVE="$TMP_DEPLOY"
            if [ "$DOCKER_CMD" = "docker" ] && [ ! -r "$DEPLOY_PATH/.env.backend.local" ]; then
              BACKEND_CONTAINER_ID="$($DOCKER_CMD ps -aq --filter 'name=^platform-backend$' | head -n1 || true)"
              if [ -z "$BACKEND_CONTAINER_ID" ]; then
                echo "ERROR: cannot read $DEPLOY_PATH/.env.backend.local and no existing platform-backend container found for env fallback."
                echo "Fix: grant the SSH user read access to .env.backend.local, or run one manual deploy after creating the file."
                exit 1
              fi
              TMP_BACKEND_ENV="$(mktemp /tmp/platform-backend-env.XXXXXX.env)"
              $DOCKER_CMD inspect -f '{{range .Config.Env}}{{println .}}{{end}}' "$BACKEND_CONTAINER_ID" > "$TMP_BACKEND_ENV"
              TMP_DEPLOY_EFFECTIVE="$(mktemp /tmp/platform-compose-deploy-effective.XXXXXX.yml)"
              sed "s#\\./\\.env\\.backend\\.local#$TMP_BACKEND_ENV#g" "$TMP_DEPLOY" > "$TMP_DEPLOY_EFFECTIVE"
            fi
            compose_cmd() {
              $DOCKER_CMD compose --project-directory "$DEPLOY_PATH" -f "$TMP_BASE" -f "$TMP_DEPLOY_EFFECTIVE" "$@"
            }
            echo "${{ github.token }}" | $DOCKER_CMD login ghcr.io -u "${{ github.actor }}" --password-stdin
            export BACKEND_IMAGE="ghcr.io/${{ needs.docker.outputs.image_namespace }}/platform-backend:${{ needs.docker.outputs.image_tag }}"
            export NGINX_IMAGE="ghcr.io/${{ needs.docker.outputs.image_namespace }}/platform-frontend:${{ needs.docker.outputs.image_tag }}"
            export POSTGRES_IMAGE="ghcr.io/${{ needs.docker.outputs.image_namespace }}/platform-postgres:${{ needs.docker.outputs.image_tag }}"
            compose_cmd pull
            compose_cmd up -d --force-recreate --remove-orphans
            NGINX_CONTAINER_ID="$(compose_cmd ps -q nginx)"
            if [ -z "$NGINX_CONTAINER_ID" ]; then
              echo "ERROR: nginx container id is empty after deploy."
              exit 1
            fi
            RUNNING_NGINX_IMAGE="$($DOCKER_CMD inspect -f '{{.Config.Image}}' "$NGINX_CONTAINER_ID")"
            if [ "$RUNNING_NGINX_IMAGE" != "$NGINX_IMAGE" ]; then
              echo "ERROR: nginx image mismatch. expected=$NGINX_IMAGE actual=$RUNNING_NGINX_IMAGE"
              exit 1
            fi
            EXPECTED_ASSET="$($DOCKER_CMD run --rm "$NGINX_IMAGE" sh -lc "grep -o '/assets/index-[^\" ]*\\.js' /usr/share/nginx/html/index.html | head -n1")"
            ACTIVE_ASSET="$(curl -ksS "$BASE_URL/" | grep -o '/assets/index-[^\" ]*\\.js' | head -n1 || true)"
            if [ -n "$EXPECTED_ASSET" ] && [ -n "$ACTIVE_ASSET" ] && [ "$EXPECTED_ASSET" != "$ACTIVE_ASSET" ]; then
              echo "ERROR: live asset mismatch. expected=$EXPECTED_ASSET actual=$ACTIVE_ASSET base_url=$BASE_URL"
              exit 1
            fi
            $DOCKER_CMD system prune -af

  smoke-staging:
    name: Smoke Staging
    runs-on: ubuntu-latest
    needs: deploy-staging
    if: github.ref == 'refs/heads/develop'
    continue-on-error: true
    steps:
      - name: Wait for containers to stabilize
        run: sleep 20
      - name: Run smoke checks
        run: |
          BASE_URL="${{ vars.STAGING_BASE_URL }}"
          if [ -z "$BASE_URL" ]; then BASE_URL="https://grummm.ru"; fi
          bash <(cat <<'SMOKE'
            set -euo pipefail
            PASS=0; FAIL=0
            ok()   { PASS=$((PASS+1)); echo "[OK] $1"; }
            fail() { FAIL=$((FAIL+1)); echo "[FAIL] $1"; }
            curl -ksS "$BASE_URL/health" | grep -q '"status":"healthy"' && ok "/health healthy" || fail "/health"
            curl -ksS "$BASE_URL/ready"  | grep -q '"status":"ready"'   && ok "/ready ready"   || fail "/ready"
            for path in / /posts /projects /login; do
              code=$(curl -ksS -o /dev/null -w "%{http_code}" "$BASE_URL$path")
              [ "$code" = "200" ] && ok "$path → 200" || fail "$path → $code"
            done
            csrf=$(curl -ksS -o /dev/null -w "%{http_code}" "$BASE_URL/api/public/security/csrf")
            { [ "$csrf" = "200" ] || [ "$csrf" = "204" ]; } && ok "CSRF endpoint" || fail "CSRF → $csrf"
            echo "Smoke summary: PASS=$PASS FAIL=$FAIL"
            [ "$FAIL" -eq 0 ]
          SMOKE) BASE_URL="$BASE_URL"

  smoke-production:
    name: Smoke Production
    runs-on: ubuntu-latest
    needs: deploy-production
    if: github.ref == 'refs/heads/main'
    continue-on-error: true
    steps:
      - name: Wait for containers to stabilize
        run: sleep 20
      - name: Run smoke checks
        run: |
          BASE_URL="${{ vars.PRODUCTION_BASE_URL }}"
          if [ -z "$BASE_URL" ]; then BASE_URL="https://grummm.ru"; fi
          PASS=0; FAIL=0
          ok()   { PASS=$((PASS+1)); echo "[OK] $1"; }
          fail() { FAIL=$((FAIL+1)); echo "[FAIL] $1"; }
          curl -ksS "$BASE_URL/health" | grep -q '"status":"healthy"' && ok "/health healthy" || fail "/health"
          curl -ksS "$BASE_URL/ready"  | grep -q '"status":"ready"'   && ok "/ready ready"   || fail "/ready"
          for path in / /posts /projects /login; do
            code=$(curl -ksS -o /dev/null -w "%{http_code}" "$BASE_URL$path")
            [ "$code" = "200" ] && ok "$path → 200" || fail "$path → $code"
          done
          csrf=$(curl -ksS -o /dev/null -w "%{http_code}" "$BASE_URL/api/public/security/csrf")
          { [ "$csrf" = "200" ] || [ "$csrf" = "204" ]; } && ok "CSRF endpoint" || fail "CSRF → $csrf"
          echo "Smoke summary: PASS=$PASS FAIL=$FAIL"
          [ "$FAIL" -eq 0 ]
